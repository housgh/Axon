worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # App traffic (the /enqueue... endpoints): plain round-robin. Where a job is enqueued has no
    # bearing on where it runs - every instance polls the shared SQL store and whichever claims a
    # job first runs it - so there's nothing to pin.
    upstream monolith_app {
        # Shared memory zone so the round-robin position is shared by every nginx worker - without
        # it each worker rotates on its own, and short-lived connections (one curl each) that land
        # on different workers can all start at app1.
        zone monolith_app 64k;
        server app1:8080;
        server app2:8080;
        server app3:8080;
    }

    # Dashboard/API (/axon/*): sticky per client IP. The dashboard's live-update hub (/axon/hub)
    # only receives pushes from the instance it's connected to (there's no Redis backplane here),
    # so pinning a browser to one instance keeps that view consistent.
    upstream monolith_dashboard {
        ip_hash;
        zone monolith_dashboard 64k;
        server app1:8080;
        server app2:8080;
        server app3:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Includes /axon/hub, the dashboard's SignalR connection - the only WebSocket in this
        # stack, browser-to-server. Jobs themselves never cross the network in monolith mode.
        location /axon {
            proxy_pass http://monolith_dashboard;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://monolith_app;
        }
    }
}
