worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Plain round-robin, deliberately no sticky sessions: this is the point of the demo for job
    # dispatch - Axon.Server.Redis's backplane is what makes it safe for the client's WebSocket
    # (/hubs/axon) to land on any of the 3 instances and still receive jobs dispatched by a
    # different one.
    upstream axon_dispatch {
        server server1:8080;
        server server2:8080;
        server server3:8080;
    }

    # ip_hash pins a given browser/client IP to the same instance for the rest of the dashboard
    # and JSON API (/axon/*, including the dashboard-push hub). This is purely for a coherent
    # browsing experience - Axon's own Servers/Clients views are inherently instance-local by
    # design (see README), so without this a request hitting a different instance on every
    # load looks like clients/servers randomly appearing and disappearing. It has no bearing on
    # dispatch correctness, which is already guaranteed by the atomic SQL claim + Redis backplane
    # regardless of which instance a request lands on.
    upstream axon_dashboard {
        ip_hash;
        server server1:8080;
        server server2:8080;
        server server3:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # The job-dispatch hub only: round-robin, no affinity, to keep proving the Redis
        # backplane's cross-instance routing rather than sidestepping the need for it.
        location /hubs/axon {
            proxy_pass http://axon_dispatch;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else (dashboard pages, JSON API, the dashboard-push hub): sticky per client
        # IP, so a browsing session consistently sees one instance's view instead of flickering
        # between instances' independently-tracked Clients/Servers lists on every request.
        location / {
            proxy_pass http://axon_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
