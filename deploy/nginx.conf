worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream axon_servers {
        # Plain round-robin, deliberately no sticky sessions: this is the point of the demo -
        # Axon.Server.Redis's backplane is what makes it safe for a client's WebSocket to land on
        # any of the 3 instances and still receive jobs dispatched by a different one.
        server server1:8080;
        server server2:8080;
        server server3:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://axon_servers;
            proxy_http_version 1.1;

            # Required for the SignalR WebSocket connections (both the job-dispatch hub and the
            # dashboard-push hub) to upgrade correctly through the proxy.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SignalR connections are long-lived; don't let nginx time them out early.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
